<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="frameGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#442a19"/>
      <stop offset="100%" stop-color="#1c0f07"/>
    </linearGradient>
    <linearGradient id="boardGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14283b"/>
      <stop offset="50%" stop-color="#162e44"/>
      <stop offset="100%" stop-color="#0e1d2c"/>
    </linearGradient>
    <filter id="chalkGlow4">
      <feGaussianBlur stdDeviation="0.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="800" height="500" rx="14" fill="url(#frameGrad4)" stroke="#120904" stroke-width="4"/>
  <rect x="14" y="14" width="772" height="472" rx="6" fill="#1b1008"/>
  <rect x="22" y="22" width="756" height="456" rx="4" fill="url(#boardGrad4)"/>

  <text x="50" y="65" font-family="'Courier New', monospace, sans-serif" font-size="20" fill="#93c5fd" opacity="0.8">
    Sistemas de Ecuaciones Lineales 2×2
  </text>
  <line x1="50" y1="75" x2="430" y2="75" stroke="#93c5fd" stroke-width="2" opacity="0.5" stroke-dasharray="4,2"/>

  <!-- System bracket { -->
  <g filter="url(#chalkGlow4)" transform="translate(140, 160)">
    <text x="0" y="120" font-family="'Comic Sans MS', cursive, sans-serif" font-size="180" font-weight="lighter" fill="#38bdf8" opacity="0.9">{</text>
    
    <!-- Eq 1: 2x + y = 7 -->
    <g transform="translate(80, 50)">
      <text x="0" y="0" font-family="'Comic Sans MS', cursive, sans-serif" font-size="80" font-weight="bold" fill="#ffffff" opacity="0.95">2</text>
      <text x="45" y="0" font-family="'Comic Sans MS', cursive, sans-serif" font-size="80" font-style="italic" fill="#ffffff" opacity="0.95">x</text>
      <text x="95" y="-5" font-family="'Comic Sans MS', cursive, sans-serif" font-size="75" fill="#fde047" opacity="0.9">+</text>
      <text x="145" y="0" font-family="'Comic Sans MS', cursive, sans-serif" font-size="80" font-style="italic" fill="#ffffff" opacity="0.95">y</text>
      <text x="195" y="-5" font-family="'Comic Sans MS', cursive, sans-serif" font-size="75" fill="#38bdf8" opacity="0.9">=</text>
      <text x="245" y="0" font-family="'Comic Sans MS', cursive, sans-serif" font-size="80" font-weight="bold" fill="#ffffff" opacity="0.95">7</text>
    </g>

    <!-- Eq 2: x - y = 2 -->
    <g transform="translate(80, 150)">
      <text x="45" y="0" font-family="'Comic Sans MS', cursive, sans-serif" font-size="80" font-style="italic" fill="#ffffff" opacity="0.95">x</text>
      <text x="95" y="-5" font-family="'Comic Sans MS', cursive, sans-serif" font-size="75" fill="#fde047" opacity="0.9">−</text>
      <text x="145" y="0" font-family="'Comic Sans MS', cursive, sans-serif" font-size="80" font-style="italic" fill="#ffffff" opacity="0.95">y</text>
      <text x="195" y="-5" font-family="'Comic Sans MS', cursive, sans-serif" font-size="75" fill="#38bdf8" opacity="0.9">=</text>
      <text x="245" y="0" font-family="'Comic Sans MS', cursive, sans-serif" font-size="80" font-weight="bold" fill="#ffffff" opacity="0.95">2</text>
    </g>
  </g>

  <text x="50" y="420" font-family="'Courier New', monospace, sans-serif" font-size="17" fill="#cbd5e1" opacity="0.6">
    // Método de reducción o suma: sumar ambas ecuaciones elimina y -> 3x = 9 -> x = 3, y = 1
  </text>
</svg>
