<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="frameGradRlc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4e3321"/>
      <stop offset="100%" stop-color="#211207"/>
    </linearGradient>
    <linearGradient id="boardGradRlc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142c1e"/>
      <stop offset="50%" stop-color="#1a3d2b"/>
      <stop offset="100%" stop-color="#112419"/>
    </linearGradient>
    <filter id="chalkGlowRlc">
      <feGaussianBlur stdDeviation="0.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="800" height="500" rx="14" fill="url(#frameGradRlc)" stroke="#1a0e07" stroke-width="4"/>
  <rect x="14" y="14" width="772" height="472" rx="6" fill="#1b1008"/>
  <rect x="22" y="22" width="756" height="456" rx="4" fill="url(#boardGradRlc)"/>

  <ellipse cx="400" cy="250" rx="300" ry="160" fill="#ffffff" opacity="0.02"/>

  <text x="50" y="65" font-family="'Courier New', monospace, sans-serif" font-size="19" fill="#a7f3d0" opacity="0.8">
    Circuitos Eléctricos II • Ecuación Íntegro-Diferencial RLC
  </text>
  <line x1="50" y1="75" x2="480" y2="75" stroke="#a7f3d0" stroke-width="2" opacity="0.5" stroke-dasharray="4,2"/>

  <!-- = L di(t)/dt + R i(t) + 1/C \int_0^t i(t) dt -->
  <g filter="url(#chalkGlowRlc)" transform="translate(65, 270)">
    <!-- = -->
    <text x="0" y="-10" font-family="'Comic Sans MS', cursive, sans-serif" font-size="75" fill="#38bdf8" opacity="0.95">=</text>
    
    <!-- L -->
    <text x="55" y="0" font-family="'Comic Sans MS', cursive, sans-serif" font-size="80" font-weight="bold" fill="#ffffff" opacity="0.95">L</text>
    
    <!-- Fraction: di(t) / dt -->
    <g transform="translate(105, -25)">
      <text x="5" y="-10" font-family="'Comic Sans MS', cursive, sans-serif" font-size="45" font-style="italic" fill="#ffffff" opacity="0.95">di(t)</text>
      <line x1="0" y1="5" x2="80" y2="5" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
      <text x="18" y="45" font-family="'Comic Sans MS', cursive, sans-serif" font-size="45" font-style="italic" fill="#ffffff" opacity="0.95">dt</text>
    </g>

    <!-- + -->
    <text x="205" y="-10" font-family="'Comic Sans MS', cursive, sans-serif" font-size="70" fill="#fde047" opacity="0.92">+</text>

    <!-- R i(t) -->
    <text x="260" y="0" font-family="'Comic Sans MS', cursive, sans-serif" font-size="80" font-weight="bold" fill="#ffffff" opacity="0.95">R</text>
    <text x="315" y="0" font-family="'Comic Sans MS', cursive, sans-serif" font-size="75" font-style="italic" fill="#ffffff" opacity="0.95">i(t)</text>

    <!-- + -->
    <text x="430" y="-10" font-family="'Comic Sans MS', cursive, sans-serif" font-size="70" fill="#fde047" opacity="0.92">+</text>

    <!-- 1 / C -->
    <g transform="translate(485, -25)">
      <text x="12" y="-10" font-family="'Comic Sans MS', cursive, sans-serif" font-size="45" font-weight="bold" fill="#ffffff" opacity="0.95">1</text>
      <line x1="0" y1="5" x2="45" y2="5" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
      <text x="10" y="45" font-family="'Comic Sans MS', cursive, sans-serif" font-size="45" font-weight="bold" fill="#ffffff" opacity="0.95">C</text>
    </g>

    <!-- Integral symbol with limits 0 and t -->
    <text x="545" y="30" font-family="'Times New Roman', serif" font-size="125" font-style="italic" fill="#ffffff" opacity="0.95">∫</text>
    <text x="590" y="-70" font-family="'Comic Sans MS', cursive, sans-serif" font-size="36" font-style="italic" fill="#fde047" opacity="0.95">t</text>
    <text x="580" y="45" font-family="'Comic Sans MS', cursive, sans-serif" font-size="34" font-weight="bold" fill="#fde047" opacity="0.95">0</text>

    <!-- i(t) dt -->
    <text x="615" y="0" font-family="'Comic Sans MS', cursive, sans-serif" font-size="75" font-style="italic" fill="#ffffff" opacity="0.95">i(t)dt</text>
  </g>

  <text x="50" y="420" font-family="'Courier New', monospace, sans-serif" font-size="16" fill="#cbd5e1" opacity="0.6">
    // Ley de Kirchhoff: derivar respecto a t para obtener L i''(t) + R i'(t) + (1/C) i(t) = v'(t)
  </text>
</svg>
