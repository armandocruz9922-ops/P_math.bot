<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="frameGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4e3321"/>
      <stop offset="100%" stop-color="#211207"/>
    </linearGradient>
    <linearGradient id="boardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#193325"/>
      <stop offset="50%" stop-color="#1e3e2d"/>
      <stop offset="100%" stop-color="#142c1f"/>
    </linearGradient>
    <filter id="chalkGlow3">
      <feGaussianBlur stdDeviation="0.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="800" height="500" rx="14" fill="url(#frameGrad3)" stroke="#1a0e07" stroke-width="4"/>
  <rect x="14" y="14" width="772" height="472" rx="6" fill="#1b1008"/>
  <rect x="22" y="22" width="756" height="456" rx="4" fill="url(#boardGrad3)"/>

  <ellipse cx="420" cy="240" rx="260" ry="140" fill="#ffffff" opacity="0.02"/>

  <text x="50" y="70" font-family="'Courier New', monospace, sans-serif" font-size="20" fill="#a7f3d0" opacity="0.8">
    Álgebra • Factorización de Trinomios
  </text>
  <line x1="50" y1="80" x2="380" y2="80" stroke="#a7f3d0" stroke-width="2" opacity="0.5" stroke-dasharray="4,2"/>

  <!-- x² - 6x + 8 = 0 -->
  <g filter="url(#chalkGlow3)" transform="translate(170, 270)">
    <text x="0" y="0" font-family="'Comic Sans MS', 'Chalkboard SE', 'Caveat', cursive, sans-serif" font-size="110" font-style="italic" fill="#ffffff" opacity="0.95">x</text>
    <text x="65" y="-50" font-family="'Comic Sans MS', 'Chalkboard SE', 'Caveat', cursive, sans-serif" font-size="65" font-weight="bold" fill="#ffffff" opacity="0.92">2</text>
    <text x="120" y="-10" font-family="'Comic Sans MS', 'Chalkboard SE', 'Caveat', cursive, sans-serif" font-size="110" fill="#fde047" opacity="0.92">−</text>
    <text x="180" y="0" font-family="'Comic Sans MS', 'Chalkboard SE', 'Caveat', cursive, sans-serif" font-size="110" font-weight="bold" fill="#ffffff" opacity="0.95">6</text>
    <text x="245" y="0" font-family="'Comic Sans MS', 'Chalkboard SE', 'Caveat', cursive, sans-serif" font-size="110" font-style="italic" fill="#ffffff" opacity="0.95">x</text>
    <text x="315" y="-5" font-family="'Comic Sans MS', 'Chalkboard SE', 'Caveat', cursive, sans-serif" font-size="100" fill="#fde047" opacity="0.92">+</text>
    <text x="385" y="0" font-family="'Comic Sans MS', 'Chalkboard SE', 'Caveat', cursive, sans-serif" font-size="110" font-weight="bold" fill="#ffffff" opacity="0.95">8</text>
    <text x="460" y="-5" font-family="'Comic Sans MS', 'Chalkboard SE', 'Caveat', cursive, sans-serif" font-size="100" fill="#38bdf8" opacity="0.92">=</text>
    <text x="535" y="0" font-family="'Comic Sans MS', 'Chalkboard SE', 'Caveat', cursive, sans-serif" font-size="110" font-weight="bold" fill="#ffffff" opacity="0.95">0</text>
  </g>

  <text x="50" y="420" font-family="'Courier New', monospace, sans-serif" font-size="17" fill="#cbd5e1" opacity="0.6">
    // Buscar dos números que multiplicados den 8 y sumados den -6: (x - 2)(x - 4) = 0
  </text>
</svg>
